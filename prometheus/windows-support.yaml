windowsMonitoring:
  enabled: true

# Windows containers produce no cAdvisor metrics, so Lens/Freelens pod charts ("Metrics not available at
# the moment") and the stock Linux compute dashboards are empty for them. windows_exporter's container
# collector has the same data under windows_container_*, so re-publish it under the cAdvisor names those
# tools query. The workload identity is in the exported_pod / exported_namespace / exported_container
# labels (pod / namespace / container on these series are windows_exporter's OWN pod, because Prometheus
# moves a scraped label aside when it collides with a target label), so the rules copy exported_* back
# into the standard names. `image` is set because Freelens filters on image!="". The new series carry
# job="windows-exporter", so they never collide with real cAdvisor series (job="kubelet").
# Filesystem is not mapped: Windows reports read/write sizes, not usage. Verified on ccg-staging.
additionalPrometheusRulesMap:
  windows-cadvisor-compat:
    groups:
      - name: windows-cadvisor-compat
        interval: 30s
        rules:
          - record: container_cpu_usage_seconds_total
            expr: |
              label_replace(label_replace(label_replace(label_replace(
                windows_container_cpu_usage_seconds_total{exported_pod!=""},
                "pod", "$1", "exported_pod", "(.+)"),
                "namespace", "$1", "exported_namespace", "(.+)"),
                "container", "$1", "exported_container", "(.+)"),
                "image", "windows", "container", ".+")
          - record: container_memory_working_set_bytes
            expr: |
              label_replace(label_replace(label_replace(label_replace(
                windows_container_private_working_set_usage{exported_pod!=""},
                "pod", "$1", "exported_pod", "(.+)"),
                "namespace", "$1", "exported_namespace", "(.+)"),
                "container", "$1", "exported_container", "(.+)"),
                "image", "windows", "container", ".+")
          - record: container_network_receive_bytes_total
            expr: |
              label_replace(label_replace(label_replace(
                windows_container_network_received_bytes_total{exported_pod!=""},
                "pod", "$1", "exported_pod", "(.+)"),
                "namespace", "$1", "exported_namespace", "(.+)"),
                "container", "$1", "exported_container", "(.+)")
          - record: container_network_transmit_bytes_total
            expr: |
              label_replace(label_replace(label_replace(
                windows_container_network_transmitted_bytes_total{exported_pod!=""},
                "pod", "$1", "exported_pod", "(.+)"),
                "namespace", "$1", "exported_namespace", "(.+)"),
                "container", "$1", "exported_container", "(.+)")

prometheus-windows-exporter:
  # Chart default is '[defaults],memory,container'. Added (verified on ccg-staging, windows_exporter 0.31.8):
  #   tcp      node-level socket/connection states (established, time_wait, failures, resets)
  #   process  per-process threads, handles, private bytes and CPU, limited to w3wp. The exporter runs on the
  #            node and sees every container's w3wp, but the series are keyed by process_id only: the
  #            pod/container labels on them are the exporter's own, so mapping a w3wp to its web pod needs
  #            another source.
  # Deliberately NOT enabled:
  #   iis        IIS is not installed on the nodes (it runs inside the containers), so it only logs a warning
  #              and exports windows_iis_info.
  #   netframework  only sees the nodes' own .NET processes (EKS-WindowsServiceHost), never the containers'
  #              w3wp CLR counters. Note: in 0.31 the old netframework_clr* names no longer exist (starting with
  #              them aborts the exporter: "unknown collector"), and netframework.enabled must be a YAML list.
  #
  # The chart does not restart the DaemonSet when this changes: after applying, run
  #   kubectl -n monitoring rollout restart ds/monitoring-prometheus-windows-exporter
  # An invalid collector name makes every restarted exporter pod crash-loop, so test on staging first.
  config: |-
    collectors:
      enabled: '[defaults],memory,container,tcp,process'
    collector:
      process:
        include: 'w3wp.*'
